sonar.projectKey=agi-gw-insurancesuite
sonar.sources=.
sonar.tests=.
# GUnit sources are analysed as tests, not as production code.
sonar.test.inclusions=**/gtest/**
# Non-source content only:
#   **/build/**, **/generated/**, **/generated_classes/**  - build output and codegen
#   **/gen/**                                              - generated theme CSS/JS and import CSVs
#   **/webresources/sass/platform/**, **/sass/icons/**     - Guidewire platform stylesheets and icon set (vendor)
#   **/webresources/js/lib/**, **/swagger-ui/**            - third-party JS/CSS bundles (jQuery form, Swagger UI)
#   **/*.map                                               - source maps of the bundles above
#   **/src/jsonschema/**                                   - JSON schema wrappers (@Generated by SchemaWrappersGenerator)
#   **/sampledata/**                                       - Guidewire sample data and its loader
#   **/geodata/**                                          - reference postcode/location data
sonar.exclusions=**/gtest/**,**/build/**,**/generated/**,**/generated_classes/**,**/gen/**,**/webresources/sass/platform/**,**/sass/icons/**,**/webresources/js/lib/**,**/swagger-ui/**,**/*.map,**/src/jsonschema/**,**/sampledata/**,**/geodata/**
# Duplicate detection runs on all analysed sources (no sonar.cpd.exclusions).
# JaCoCo XML per centre, written by tools/ci/coverage.init.gradle during the GUnit stages.
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/cc/jacocoTestReport.xml,build/reports/jacoco/pc/jacocoTestReport.xml,build/reports/jacoco/bc/jacocoTestReport.xml,build/reports/jacoco/cm/jacocoTestReport.xml
sonar.junit.reportPaths=build/test-results
# Scanner waits for the server-side quality gate and fails on a red gate.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=1800
