# --- Phase 3A dev-only cut-over (gate: GREEN_REPLAY rows in tools/ci/reconciliation-status.csv;
# evidence: docs/reconciliation/PHASE2-REPLAY-EVIDENCE.md). Candidate is authoritative per brand
# with the legacy builder as reverse shadow: any diff auto-alerts and auto-reverts the record.
# Brand order ALBDIR -> ALBBRK -> RETPLS -> HERIT (heritage last). dev ONLY - every other
